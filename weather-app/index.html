<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skye — Weather</title>
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- Search bar -->
  <header class="header">
    <div class="logo">Skye</div>
    <div class="search-wrap">
      <input type="text" id="search-input" class="search-input" placeholder="Search city..." autocomplete="off" />
      <button id="search-btn" class="search-btn" aria-label="Search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      </button>
    </div>
    <button id="unit-toggle" class="unit-toggle" title="Switch units">°C / °F</button>
  </header>

  <!-- Main -->
  <main class="main">

    <!-- Error / empty state -->
    <div id="empty-state" class="empty-state">
      <p class="empty-icon">⛅</p>
      <p>Enter a city to get started.</p>
    </div>

    <!-- Error message -->
    <div id="error-msg" class="error-msg hidden">City not found. Try again.</div>

    <!-- Loader -->
    <div id="loader" class="loader hidden">
      <div class="spinner"></div>
    </div>

    <!-- Weather card -->
    <section id="weather-card" class="weather-card hidden">

      <!-- Hero -->
      <div class="card-hero">
        <div class="city-info">
          <h1 class="city-name" id="city-name"></h1>
          <p class="city-date" id="city-date"></p>
          <p class="city-desc" id="city-desc"></p>
        </div>
        <div class="temp-display">
          <span class="temp-big" id="temp-big"></span>
          <span class="temp-feels" id="temp-feels"></span>
        </div>
        <div class="weather-icon-wrap" id="weather-icon-wrap"></div>
      </div>

      <!-- Stats row -->
      <div class="stats-row">
        <div class="stat">
          <span class="stat-label">Humidity</span>
          <span class="stat-value" id="humidity"></span>
        </div>
        <div class="stat">
          <span class="stat-label">Wind</span>
          <span class="stat-value" id="wind"></span>
        </div>
        <div class="stat">
          <span class="stat-label">Visibility</span>
          <span class="stat-value" id="visibility"></span>
        </div>
        <div class="stat">
          <span class="stat-label">Pressure</span>
          <span class="stat-value" id="pressure"></span>
        </div>
      </div>

      <!-- Sunrise / Sunset -->
      <div class="sun-row">
        <div class="sun-item">
          <span class="sun-label">Sunrise</span>
          <span class="sun-icon">🌅</span>
          <span class="sun-time" id="sunrise"></span>
        </div>
        <div class="sun-divider"></div>
        <div class="sun-item">
          <span class="sun-label">Sunset</span>
          <span class="sun-icon">🌇</span>
          <span class="sun-time" id="sunset"></span>
        </div>
      </div>

      <!-- 5-day forecast -->
      <div class="forecast-section">
        <h2 class="section-title">5-Day Forecast</h2>
        <div class="forecast-row" id="forecast-row"></div>
      </div>

    </section>
  </main>

  <footer class="footer">
    Data via <a href="https://openweathermap.org" target="_blank">OpenWeatherMap</a>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
